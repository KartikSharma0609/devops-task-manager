name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - Python Tests
    types:
      - completed

jobs:

  deploy:

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-south-1
      ECR_REGISTRY: 689505268101.dkr.ecr.ap-south-1.amazonaws.com
      ECR_REPOSITORY: devops-task-manager
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

        run: |

          set -e

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "export HOME=/home/ec2-user",
              "cd /home/ec2-user/devops-task-manager",
              "git config --global --add safe.directory /home/ec2-user/devops-task-manager",
              "echo Pulling latest deployment configuration...",
              "git pull origin main",
              "echo Logging into Amazon ECR...",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 689505268101.dkr.ecr.ap-south-1.amazonaws.com",
              "echo Pulling Docker image...",
              "docker pull 689505268101.dkr.ecr.ap-south-1.amazonaws.com/devops-task-manager:${{ github.event.workflow_run.head_sha }}",
              "echo Deploying application...",
              "ECR_REGISTRY=689505268101.dkr.ecr.ap-south-1.amazonaws.com IMAGE_TAG=${{ github.event.workflow_run.head_sha }} docker compose -f docker-compose.prod.yml up -d",
              "echo Deployment status:",
              "docker compose -f docker-compose.prod.yml ps",
              "echo Waiting for application to become healthy...",
              "for i in $(seq 1 12); do if curl -fsS http://localhost/system/health; then echo Application healthy!; exit 0; fi; echo Application not ready yet...; sleep 5; done",
              "echo Application failed to become healthy",
              "docker compose -f docker-compose.prod.yml ps",
              "docker logs task-manager --tail 100",
              "exit 1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          aws ssm wait command-executed \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" || true

          echo "Deployment result:"

          aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --query '{
              Status: Status,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --query 'Status' \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
